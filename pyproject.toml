[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-template"
version = "0.1.0"
description = "研究用リポジトリのテンプレート（実験パイプライン・解析・テスト・記録）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html"
testpaths = ["tests"]
markers = [
    "unit: isolated tests of individual functions, formulas, and API contracts",
    "e2e: end-to-end checks that run experiment scripts and inspect saved data",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["archive"]
